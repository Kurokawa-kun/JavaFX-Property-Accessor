plugins
{
    id 'java-library'
    id 'maven-publish'
}

repositories
{
    mavenCentral()
}

java
{
    toolchain
    {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies
{
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    compileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
}

group = 'io.github.kurokawa_kun'
version = '0.9.0'

//  自分自身の定義
publishing
{
    publications
    {
        mavenJava(MavenPublication)
        {
            artifactId = 'javafx-property-accessor'
            from components.java
        }
    }
}

jar
{
    manifest
    {
        attributes('Automatic-Module-Name': 'JavaFxPropertyAccessor')
    }
}

tasks.named('build')
{
    //  自身のビルドが成功した後に自身も公開する
    finalizedBy('publishToMavenLocal')
}

tasks.withType(JavaCompile)
{
    //  以下のパッケージ内のクラスはALL-UNNAMED（全無名モジュール）に対してアクセスを許可すること。
    //  特定のモジュール名を指定してもコンパイルは通りますが、使用時（アノテーションプロセッサの動作時）にコンパイラの実行環境を取得できません。
    //  当該パッケージが名前付きモジュールにアクセスを許可していないためです。
    options.compilerArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED'
    options.compilerArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED'
    options.compilerArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED'
    options.compilerArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED'
    options.compilerArgs += '--add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED'
}
